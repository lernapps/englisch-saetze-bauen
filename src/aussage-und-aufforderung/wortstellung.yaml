# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Wer tut was, wo und wann?"
description: "Sophie erzählt, was sie am Montag tut. Du lernst, einen englischen Satz in der richtigen Reihenfolge zu bauen: Subjekt, Verb, Objekt, Ort, Zeit."
competencies: [wortstellung]
scope: "Die Seite führt die Satzleiste mit fünf Satzkarten ein: Subjekt (wer), Verb (was tut er), Objekt (was), Ort (wo) und Zeit (wann). Ein englischer Aussagesatz steht in dieser Reihenfolge, und der Ort steht vor der Zeit (at home on Monday). Das Verb steht direkt hinter dem Subjekt. Nicht hier, weil sie auf späteren Seiten stehen: Aufforderungen, Fragen, Verneinung und die Stellung der Häufigkeitswörter."
blocks:
  - type: section
    id: einstieg
    title: Sophie erzählt von Montag
    blocks:
      - type: figure
        image: images/szene-wortstellung.svg
        alt: "Sophie, Ellie, Amir und Peter stehen nebeneinander im Klassenzimmer. Sophie spricht in einer Sprechblase: „I eat lunch at school on Friday.“"
        caption: "Von links: Sophie (Zöpfe) spricht, daneben Ellie (roter Pferdeschwanz), Amir (Brille) und Peter (gelbe Jacke)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Sophie (11) wohnt bei der Familie Parker, Ellie (11) ist ihre Gastschwester. Mr Hill ist ihr Englischlehrer. Sophie sagt, was sie am Freitag in der Schule isst: „I eat lunch at school on Friday.“"
      - type: single-choice
        id: wortstellung-start
        text: "Welcher Satz sagt auf Englisch: Ich spiele am Montag zu Hause Fußball?"
        options:
          - text: I play football at home on Monday.
            correct: true
            info: So lautet der Satz. Zuerst kommt, wer etwas tut, dann was er tut, dann was oder wen, dann wo und wann.
          - text: I football play at home on Monday.
            correct: false
            info: Das Verb play muss direkt hinter I stehen. Football kommt erst danach.
          - text: I play on Monday football at home.
            correct: false
            info: Die Wörter sind richtig, aber die Reihenfolge nicht. Football gehört direkt hinter das Verb.
        explanation: Im Englischen hat jeder Teil des Satzes seinen festen Platz.
        links:
          - title: Lernlandkarte Englisch · Wortstellung im Aussagesatz
            url: https://lernapps.net/apps/map/englisch/c/wortstellung/
      - type: text
        text: "**Das kannst du danach:** Du baust englische Aussagesätze in der richtigen Reihenfolge und stellst den Ort vor die Zeit."
  - type: section
    id: neu
    title: Die Satzleiste mit den fünf Karten
    blocks:
      - type: text
        text: "Mr Hill hängt eine **Satzleiste** an die Wand. Auf ihr liegen **Satzkarten**, jede mit einer eigenen Farbe. Das **Subjekt** (blau) sagt, wer etwas tut. Das **Verb** (rot) sagt, was er tut. Das **Objekt** (grün) sagt, was oder wen. Der **Ort** (orange) sagt, wo, und die **Zeit** (violett) sagt, wann. Die Farben gehören zu den Karten, nicht zu den Kindern."
      - type: figure
        image: images/satzleiste-aussage.svg
        alt: Eine Reihe mit fünf Satzkarten von links nach rechts. Blau I, rot play, grün football, orange at home, violett on Monday. Unter jeder Karte steht ihr Name.
        caption: "Ein Aussagesatz in einer Reihe. Der Ort (at home) liegt vor der Zeit (on Monday)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Die Satzkarten
        header: [Karte, Frage, Beispiel]
        rows:
          - [Subjekt, Wer?, Sophie]
          - [Verb, Was tut sie?, studies]
          - [Objekt, Was?, English]
          - [Ort, Wo?, at home]
          - [Zeit, Wann?, on Monday]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: "**Subjekt, Verb, Objekt, Ort, Zeit.** Sophie studies English at home on Monday. Der Ort steht vor der Zeit. Im Deutschen darfst du die Wörter oft umstellen, im Englischen ist die Reihenfolge fester. Bei he, she und it hängt ein **s** am Verb: plays."
      - type: vocabulary
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        languages: { source: de, target: en }
        entries:
          - target: "play"
            source: "spielen"
          - target: "eat"
            source: "essen"
          - target: "watch"
            source: "anschauen"
          - target: "read"
            source: "lesen"
          - target: "teach"
            source: "unterrichten"
          - target: "study"
            source: "lernen"
          - target: "English"
            source: "Englisch"
          - target: "football"
            source: "Fußball"
          - target: "pizza"
            source: "Pizza"
          - target: "lunch"
            source: "Mittagessen"
          - target: "a book"
            source: "ein Buch"
          - target: "a film"
            source: "ein Film"
          - target: "in the park"
            source: "im Park"
          - target: "at home"
            source: "zu Hause"
          - target: "at school"
