  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: ordering
        id: wortstellung-karten
        text: Amir erzählt von Samstag. Lege die Karten zu einem Satz.
        items:
          - Amir
          - plays
          - football
          - in the park
          - on Saturday
        explanation: "Subjekt, Verb, Objekt, Ort, Zeit: Der Ort steht vor der Zeit."
        links:
          - title: Lernlandkarte Englisch · Wortstellung im Aussagesatz
            url: https://lernapps.net/apps/map/englisch/c/wortstellung/
      - type: matching
        id: wortstellung-zuordnen
        text: Sophie legt einen Satz. Welche Karte gehört zu welchem Satzteil?
        pairs:
          - left: Sophie
            right: Subjekt
          - left: watches
            right: Verb
          - left: a film
            right: Objekt
          - left: at home
            right: Ort
          - left: on Sunday
            right: Zeit
        explanation: Jeder Satzteil hat eine Karte. Wer etwas tut, ist das Subjekt. Wann es geschieht, ist die Zeit.
        links:
          - title: Lernlandkarte Englisch · Wortstellung im Aussagesatz
            url: https://lernapps.net/apps/map/englisch/c/wortstellung/
      - type: language-task
        id: wortstellung-bilden
        languages: { source: de, target: en }
        task: Die Karten liegen durcheinander. Schreibe den ganzen Satz in der richtigen Reihenfolge.
        form: { case: hint, punctuation: hint }
        items:
          - cue: pizza · Ellie · eats · at home · on Sunday
            target: Ellie eats pizza at home on Sunday.
            mistakes:
              - answer: Ellie eats pizza on Sunday at home.
                message: "Wir üben: erst der Ort, dann die Zeit. Die Zeit kommt zuletzt."
              - answer: Ellie pizza eats at home on Sunday.
                message: Das Verb steht direkt hinter dem Subjekt, dann kommt das Objekt.
          - cue: a book · Mr Hill · reads · in the classroom · on Friday
            target: Mr Hill reads a book in the classroom on Friday.
            mistakes:
              - answer: Mr Hill reads a book on Friday in the classroom.
                message: "Wir üben: erst der Ort, dann die Zeit."
              - answer: Mr Hill a book reads in the classroom on Friday.
                message: Das Verb steht direkt hinter dem Subjekt.
          - cue: lunch · Peter · eats · at school · every day
            target: Peter eats lunch at school every day.
            mistakes:
              - answer: Peter eats lunch every day at school.
                message: "Wir üben: erst der Ort, dann die Zeit."
        hint: Beginne mit dem Subjekt, dann das Verb, das Objekt, den Ort und zuletzt die Zeit.
      - type: language-task
        id: wortstellung-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz stehen die Karten falsch. Schreibe den Satz richtig.
        form: { case: hint, punctuation: hint }
        items:
          - cue: I play football on Saturday in the park.
            target: I play football in the park on Saturday.
            mistakes:
              - answer: I play football on Saturday in the park.
                message: Noch nicht ganz. Welche Karte muss vor die andere, der Ort oder die Zeit?
          - cue: Sophie a film watches at home.
            target: Sophie watches a film at home.
            mistakes:
              - answer: Sophie a film watches at home.
                message: Noch nicht ganz. Welche Karte steht direkt hinter dem Subjekt?
        hint: Lege die Satzleiste im Kopf, Karte für Karte.
      - type: language-task
        id: wortstellung-uebersetzen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: hint }
        items:
          - source: Peter spielt am Samstag im Park Fußball.
            target: Peter plays football in the park on Saturday.
            mistakes:
              - answer: Peter play football in the park on Saturday.
                message: "He, she, it – das s muss mit. Peter ist „er“, also plays."
              - answer: Peter plays football on Saturday in the park.
                message: "Wir üben: erst der Ort, dann die Zeit."
            accepted: [On Saturday Peter plays football in the park.]
          - source: Ellie isst jeden Tag in der Schule Pizza.
            target: Ellie eats pizza at school every day.
            mistakes:
              - answer: Ellie eat pizza at school every day.
                message: "He, she, it – das s muss mit. Ellie ist „sie“, also eats."
              - answer: Ellie eats pizza every day at school.
                message: "Wir üben: erst der Ort, dann die Zeit."
          - source: Amir schaut am Sonntag zu Hause einen Film an.
            target: Amir watches a film at home on Sunday.
            mistakes:
              - answer: Amir watches at home a film on Sunday.
                message: Das Objekt steht direkt hinter dem Verb.
        hint: "Frage dich der Reihe nach: Wer tut was, wo und wann?"
      - type: language-task
        id: wortstellung-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: hint }
        items:
          - audio: ellie-plays-football-at-school-on-friday.mp3
            target: Ellie plays football at school on Friday.
          - audio: peter-eats-pizza-in-the-park-on-sunday.mp3
            target: Peter eats pizza in the park on Sunday.
          - audio: amir-reads-a-book-at-home-every-day.mp3
            target: Amir reads a book at home every day.
  - type: section
    id: anwenden
    title: Ein Satz für die Satzleiste
    blocks:
      - type: speaking-task
        id: wortstellung-nachsprechen
        language: en
        items:
          - audio: sophie-reads-a-book-at-home-on-monday.mp3
            text: Sophie reads a book at home on Monday.
          - audio: mr-hill-teaches-english-at-school-every-day.mp3
            text: Mr Hill teaches English at school every day.
          - audio: ellie-and-peter-play-football-in-the-park.mp3
            text: Ellie and Peter play football in the park.
        hint: Hör den Satz zuerst. Sprich dann langsam nach und lege dabei im Kopf die Karten.
      - type: open-task
        id: wortstellung-satz
        task: "Mr Hill hängt die Sätze der Klasse an die Wand. Schreibe zwei Sätze über Sophie, Ellie, Peter oder Amir. In jedem Satz soll stehen, wer was tut, wo und wann."
        points:
          - text: In jedem Satz steht zuerst das Subjekt, direkt dahinter das Verb.
            source: /aussage-und-aufforderung/wortstellung/#neu
          - text: Der Ort steht vor der Zeit.
            source: /aussage-und-aufforderung/wortstellung/#neu
          - text: Es sind ganze Sätze mit Punkt am Ende.
            kind: form
        solution: |
          Sophie plays football in the park on Saturday. Peter eats pizza at home on Sunday.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Die Sätze der Klasse hängen an der Satzleiste. Mr Hill ruft: „Stand up!“ Dieser Satz hat nur eine Karte, das Verb. Wo ist das Subjekt geblieben? Das erfährst du auf der nächsten Seite."
