# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: englisch/grammatik
title: Sätze bauen
intro: In der Millbrook School hängt Mr Hill neben den Zeitstrahl eine Satzleiste mit bunten Karten. Sophie (11, aus Deutschland), Ellie (11), ihr Bruder Peter (9) und Amir (11) legen damit englische Sätze. Du lernst, in welcher Reihenfolge ein englischer Satz gebaut wird, wie du mit dem Helfer do fragst und verneinst, wie du kurz antwortest und wie du mit einem question tag nachfragst.
languages: [de]
scope:
  text: Die App erklärt, wie man englische Sätze baut, für Kinder im ersten und zweiten Lernjahr. Satzkarten (Subjekt, Verb, Objekt, Ort, Zeit) zeigen die Reihenfolge. Eine eigene Karte ist der Helfer do, does oder did. Er springt vor das Subjekt, wenn man fragt, und steht mit not vor dem Verb, wenn man verneint, und das Verb geht ohne Endung. Gelernt werden Wortstellung, Imperativ, Fragen und Verneinung im simple present und simple past, Kurzantworten, Fragewörter, Fragen nach dem Subjekt, Fragen mit Präposition am Ende und question tags. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Die Zeitformen selbst (steht im Explainer „Zeiten auf dem Zeitstrahl“)
    - Nebensätze, indirekte Rede und indirekte Fragen
    - Die Satzmelodie der Frage
    - Die Stellung der Adverbien
    - Betonung mit do und Inversion (Klasse 9 bis 10)
chapters: [fragen-mit-do]
