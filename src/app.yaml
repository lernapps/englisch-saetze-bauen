format: 2
strand: englisch/grammatik
title: Sätze bauen
intro: In der Millbrook School hängt Mr Hill eine Satzleiste mit bunten Karten an die Wand. Sophie, Ellie, Peter und Amir legen damit englische Sätze. Du lernst, in welcher Reihenfolge ein englischer Satz gebaut wird, wie du mit dem Helfer do fragst und verneinst, wie du kurz antwortest und wie du mit einem question tag nachfragst. Am Ende liest du Texte über Marie Curie und die Mondlandung und übst, mit dem Helfer etwas zu betonen und Sätze umzudrehen.
languages: [de]
scope:
  text: Die App erklärt, wie man englische Sätze baut, für Kinder im ersten und zweiten Lernjahr und für Jugendliche in Klasse 9 bis 10. Satzkarten (Subjekt, Verb, Objekt, Ort, Zeit) zeigen die Reihenfolge. Eine eigene Karte ist der Helfer do, does oder did. Er springt vor das Subjekt, wenn man fragt, und steht mit not vor dem Verb, wenn man verneint, und das Verb geht ohne Endung. Gelernt werden Wortstellung, Imperativ, Fragen und Verneinung im simple present und simple past, Kurzantworten, Fragewörter, Fragen nach dem Subjekt, Fragen mit Präposition am Ende und question tags, später die Betonung mit do und die Inversion. Die Beispiele der ersten Kapitel stammen aus dem Alltag von Sophie, Ellie, Peter und Amir, die der letzten Kapitel aus Sachtexten mit Daten und Quellen.
  out:
    - Die Zeitformen selbst (steht im Explainer „Zeiten auf dem Zeitstrahl“)
    - Nebensätze, indirekte Rede und indirekte Fragen
    - Die Satzmelodie der Frage
    - Die Stellung der Adverbien
    - Inversion in Bedingungssätzen, nach so und such und nach Ortsadverbien
chapters: [aussage-und-aufforderung, fragen-mit-do, did-und-tags, betonen-und-umstellen]
